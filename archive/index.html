<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVE Exploit Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    <h1>CVE Exploit Database</h1>
                </div>
                <span class="subtitle">PoC & Exploit search</span>
            </div>
            <div class="header-right">
                <div class="stats">
                    <div class="stat">
                        <span class="stat-value" id="total-cve">0</span>
                        <span class="stat-label">Всего записей</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="na-counter">0</span>
                        <span class="stat-label">Без CVE</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="search-wrapper">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="search-input" placeholder="Поиск по CVE ID или описанию..." autofocus>
            </div>
            <select id="source-filter" class="source-filter">
                <option value="">Все источники</option>
            </select>
            <button id="add-button" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Добавить
            </button>
        </div>

        <div class="table-container">
            <table id="cve-table">
                <thead>
                    <tr>
                        <th class="col-year">Год</th>
                        <th class="col-cve">CVE ID</th>
                        <th class="col-desc">Описание</th>
                        <th class="col-links">Ссылки</th>
                        <th class="col-source">Источник</th>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
            <div class="empty-state" id="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <p>Ничего не найдено</p>
            </div>
        </div>

        <div class="pagination" id="pagination">
            <button id="prev-page" class="btn btn-secondary" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                Назад
            </button>
            <span id="page-info">Страница 1</span>
            <button id="next-page" class="btn btn-secondary">
                Вперёд
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Modal: Детали CVE -->
    <div id="detail-modal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-cve-id"></h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- Modal: Добавить CVE -->
    <div id="add-modal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h2>Добавить CVE</h2>
                <button class="modal-close">&times;</button>
            </div>
            <form id="add-cve-form" class="modal-body">
                <div class="form-group">
                    <label for="cve-id-input">CVE ID</label>
                    <input type="text" id="cve-id-input" placeholder="CVE-2024-12345" required>
                </div>
                <div class="form-group">
                    <label for="year-input">Год</label>
                    <input type="number" id="year-input" placeholder="2024" required>
                </div>
                <div class="form-group">
                    <label for="description-input">Описание</label>
                    <textarea id="description-input" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="links-input">Ссылки (через запятую)</label>
                    <input type="text" id="links-input" placeholder="https://github.com/...">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
